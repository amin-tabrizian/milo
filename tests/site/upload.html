<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Upload</title></head>
<body>
<h1>Apply</h1>
<label for="cv">Resume</label>
<input id="cv" type="file" onchange="document.getElementById('picked').textContent = this.files.length ? 'Picked ' + this.files[0].name : ''">
<p id="picked"></p>
</body>
</html>
