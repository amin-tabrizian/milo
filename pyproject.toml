[project]
name = "milo"
version = "0.1.0"
description = "Voice and text phone client for goose, served from this Mac"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pyyaml>=6",
    "croniter>=3",
    "pywebpush>=2",
    "mcp>=2.3.0",
    "playwright>=1.64.0",
    "keyring>=25.7.0",
    "pyotp>=2.10.0",
    "kokoro-onnx>=0.6.1",
    "soundfile>=0.14.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not e2e and not agent'"
markers = [
    "e2e: real headless Chrome and Playwright MCP, no AI model (about a minute)",
    "agent: full runs through goose and Claude in a test bridge (slow, uses your Claude plan)",
]
